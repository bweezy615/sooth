<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<!-- Source for /assets/og.png. Rendered at 1200x630 and screenshotted; it reuses
     the real sooth.css tokens/type so the share card IS the brand, not new art.
     Regenerate: open at viewport 1200x630, screenshot to assets/og.png. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/sooth.css">
<style>
  html,body{margin:0}
  .og{width:1200px;height:630px;background:var(--bg);position:relative;
    padding:76px 84px;display:flex;flex-direction:column;justify-content:space-between;
    overflow:hidden;border-bottom:3px solid var(--pos)}
  .brand{display:flex;align-items:center;gap:16px;position:relative}
  .brand svg{width:52px;height:52px}
  .brand b{font-size:38px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
  .brand .tld{color:var(--pos)}
  .mid{position:relative}
  .mid h1{font-size:108px;line-height:.98;letter-spacing:-.03em;margin:0;color:var(--ink);font-weight:800}
  .mid h1 .g{color:var(--pos);display:block}
  .mid p{font-family:var(--num);font-size:26px;color:var(--ink-2);margin:26px 0 0;letter-spacing:-.01em}
  .foot{display:flex;align-items:center;gap:16px;position:relative}
  .foot .chip{font-family:var(--num);font-size:20px;padding:8px 18px}
  .foot .plus{font-family:var(--num);font-size:20px;color:var(--muted);letter-spacing:.04em}
</style>
</head>
<body>
<div class="og">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="13" fill="none" stroke="#2A2F3A" stroke-width="2.5"/>
      <path d="M16 6 A10 10 0 0 1 26 16" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="16" cy="16" r="2.6" fill="#4ADE80"/>
    </svg>
    <b>sooth<span class="tld">.bet</span></b>
  </div>
  <div class="mid">
    <h1>Better prices.<span class="g">Every book.</span></h1>
    <p>The best available price on every side, against the de-vigged fair line.</p>
  </div>
  <div class="foot">
    <span class="chip pos">tools &amp; data, not picks</span>
    <span class="plus">18+ · where lawful</span>
  </div>
</div>
</body>
</html>

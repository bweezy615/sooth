<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sooth — Research Workspace</title>
<meta name="description" content="One game as an instrument: fair price, every book's number, market width, movement, and analysis. Research only.">
<meta property="og:title" content="Sooth — Research Workspace">
<meta property="og:description" content="One game as an instrument: fair price, every book's number, market width, movement, and analysis. Research only.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://sooth.bet/og.jpg">
<meta property="og:url" content="https://sooth.bet/game">
<!-- no canonical: /game?e=... is per-game; a shared canonical would deindex every game but one -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/desk.css">
<style>
  /* ======================================================================
     FROZEN MARKET — the single-game workspace.
     Same half of the metaphor as the board: this is liquid, one game deep.
     The instrument grid stays exactly the grid it was; it is recoloured to
     the cold palette and given the one lit rim, because on this page it is
     the hero surface — the first read of the game.
     Teal appears on three things only: the rim, the better number, and the
     control the reader is currently pressing. Everything else is hairline,
     cool white and near-black.
     ====================================================================== */
  .ws-crumb a.tl{transition:color var(--t-hover) ease}
  .ws-crumb a.tl:hover{color:var(--brand)}

  /* the instrument grid: cold glass, and the favourable number is the only
     lit reading on it */
  .ws-grid{background:linear-gradient(180deg,#141B22 0%,#0E141A 55%,#0A0F14 100%)}
  .ws-cell .v.up{text-shadow:0 0 14px rgba(45,212,167,.30)}
  .ws-cell .v small{color:var(--dim)}

  .ws-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 28px;
    align-items:end;padding:22px 0 18px;border-bottom:1px solid var(--hair)}
  .ws-match{min-width:0}
  .ws-match .tl{display:block;margin-bottom:8px;color:var(--mut)}
  .ws-matchup{font:700 clamp(24px,4vw,42px)/1.08 var(--sans);
    letter-spacing:-.035em;color:var(--ink)}
  .ws-matchup .at{font:500 .56em/1 var(--mono);letter-spacing:.08em;
    color:var(--mut);margin:0 .34em}
  .ws-records{display:block;margin-top:9px;font:500 11px/1.4 var(--mono);
    letter-spacing:.07em;color:var(--mut)}
  .ws-fair{text-align:right;padding-left:22px;border-left:1px solid var(--hair)}
  .ws-fair .tl{display:block;margin-bottom:7px;color:var(--mut)}
  .ws-fair .fair-big{font:700 clamp(24px,3.2vw,36px)/1 var(--mono);
    letter-spacing:-.04em;color:var(--ink)}
  .ws-time{grid-column:1/-1;margin:0;color:var(--mut)}
  .workspace-nav{display:flex;gap:4px;padding:10px 0;border-bottom:1px solid var(--hair)}
  .workspace-nav a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;
    font:600 10px/1 var(--mono);letter-spacing:.12em;color:var(--mut)}
  .workspace-nav a:hover,.workspace-nav a:focus-visible{color:var(--ink);background:var(--g2)}
  .compare-more{display:none}

  /* per-side market slabs: the fair price in the header is a reading, not a
     caption, so it comes up out of metadata grey */
  .mkt .sec-h .more{color:var(--ink2)}

  /* the waterline — a live table's header rule is chrome that belongs to
     us, so it is the one hue. Matches the board on /market. */
  .itab thead th{border-bottom:1px solid rgba(45,212,167,.30)}

  /* ---- instrument controls on dark glass ------------------------------
     The analyst row was a search field and a key loose on the page. Here it
     is one control surface: a slab lit along its top edge, the field cut
     into it as an inset groove, one lit key, and a rim that answers focus.
     Identical treatment to /market so the two pages are one instrument. */
  .an-in{gap:0;align-items:stretch;padding:5px;max-width:720px;
    border:1px solid var(--hair2);border-radius:var(--r);
    background:linear-gradient(180deg,#141B22 0%,#0E141A 55%,#0A0F14 100%);
    box-shadow:inset 0 1px 0 rgba(190,240,245,.10),
               inset 0 -1px 0 rgba(0,0,0,.55),
               0 18px 40px -26px rgba(0,0,0,.9);
    transition:border-color var(--t-hover) ease,box-shadow var(--t-hover) ease}
  .an-in:focus-within{border-color:rgba(45,212,167,.45);
    box-shadow:inset 0 1px 0 rgba(190,240,245,.12),
               0 0 0 1px rgba(45,212,167,.16),
               0 18px 40px -26px rgba(0,0,0,.9)}
  .an-in input{border:1px solid rgba(0,0,0,.5);border-right:0;
    border-radius:2px 0 0 2px;padding:10px 13px;
    background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(255,255,255,.02));
    box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
  .an-in input::placeholder{color:var(--mut)}
  .an-in button{font:700 11px/1 var(--mono);letter-spacing:.16em;
    color:var(--g0);background:var(--brand);border-radius:2px;padding:0 20px;
    box-shadow:inset 0 1px 0 rgba(219,255,246,.45),
               0 0 20px -8px rgba(45,212,167,.9)}

  /* the question chips carry the promo's teal triangle; hover lights the
     triangle rather than washing the whole chip in the signal colour */
  .an-chips .an-chip{position:relative;text-align:left;color:var(--ink2);
    padding:8px 12px 8px 24px;letter-spacing:.08em;border-color:var(--hair2)}
  .an-chips .an-chip::before{content:"";position:absolute;left:11px;top:50%;
    margin-top:-4px;border:4px solid transparent;border-left-color:var(--brand);
    opacity:.42;transition:opacity var(--t-hover) ease}
  .an-chips .an-chip:hover{color:var(--ink);border-color:rgba(45,212,167,.42)}
  .an-chips .an-chip:hover::before{opacity:1}

  /* the timeline range keys are a selector, and the selected one had no
     state at all — aria-pressed was announced but never drawn. The pressed
     key is the one place teal is allowed to fill, because it is reporting
     which window you are actually looking at. */
  #tlRange{display:inline-flex;gap:4px}
  #tlRange .an-chip{padding:6px 10px;letter-spacing:.1em}
  #tlRange .an-chip[aria-pressed="true"]{color:var(--brand);
    border-color:rgba(45,212,167,.45);background:var(--brand-dim)}

  /* ---- polish pass ------------------------------------------------------
     Alignment, reserved space, real names on the controls, 44px targets, and
     one section header for the pair of market slabs that had none. No new
     hue, no radius, no scroller. */

  /* a field needs a name of its own; a placeholder is an example and it
     leaves the moment you type */
  .vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);
    white-space:nowrap;border:0}

  /* the workspace holds the height it is about to need, so the page does not
     grow 900px under a reader who has already started reading the header */
  #ws.ld{min-height:640px}

  /* a section's sub is a sentence, not metadata: --dim is 3.2:1 on --g0,
     under AA, and these lines carry what the surface actually is */
  .sec-h .sub{color:var(--mut)}

  /* 11px is the floor for type a person is expected to read: the ladder's
     column names and the analyst's question chips were under it. The size
     comes back out of tracking, not out of legibility. */
  .itab thead th{font-size:11px;letter-spacing:.1em}
  .an-chips .an-chip,#tlRange .an-chip{font-size:11px}
  /* the age of an observation is data, not decoration */
  .mv-meta{font-size:11px}

  /* the crumb was a 10px word with a 10px target. It is the only way back. */
  .ws-crumb a.tl{display:inline-flex;align-items:center;min-height:44px;
    padding-right:10px}

  /* the instrument grid reads as one row of readings, so its cells sit on one
     baseline: the label block is fixed and the number sits under it, whether
     or not the number carries a unit */
  .ws-cell{display:flex;flex-direction:column;justify-content:space-between;
    min-height:70px}
  .ws-cell .tl{line-height:1.3}

  .open-market{margin-top:4px;padding:22px 0 18px;border-top:1px solid var(--hair2);border-bottom:1px solid var(--hair);background:var(--g1)}
  .open-meta{display:flex;justify-content:space-between;gap:20px;padding:0 18px 16px;color:var(--mut)}
  .open-matchup{display:flex;align-items:center;justify-content:center;gap:.34em;padding:4px 18px 22px;font:700 clamp(30px,5vw,58px)/1 var(--sans);letter-spacing:-.045em;color:var(--ink)}
  .open-matchup .at{font:500 .34em/1 var(--mono);letter-spacing:.12em;color:var(--mut)}
  .open-read{display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1.15fr) minmax(210px,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .open-quote{padding:18px;min-width:0}.open-quote+.open-quote{border-left:1px solid var(--hair)}
  .open-quote .tl{display:block;margin-bottom:9px;color:var(--mut)}
  .open-side{font:600 14px/1.2 var(--sans);color:var(--ink2)}
  .open-price{margin-top:5px;font:700 clamp(30px,3.8vw,48px)/1 var(--mono);letter-spacing:-.05em;color:var(--ink)}
  .open-best .open-price{color:var(--brand);text-shadow:0 0 18px rgba(45,212,167,.2)}
  .open-book{display:block;margin-top:8px;font:600 11px/1.3 var(--mono);letter-spacing:.08em;color:var(--ink2)}
  .open-gap{display:block;margin-top:6px;font:600 11px/1.3 var(--mono);color:var(--brand)}
  .open-range{padding:18px}.open-range-head{display:flex;justify-content:space-between;gap:12px;color:var(--mut)}
  .open-range-line{position:relative;height:24px;margin:10px 5px 4px;border-top:1px solid var(--hair2)}
  .open-range-line::before,.open-range-line::after{content:"";position:absolute;top:-4px;width:1px;height:8px;background:var(--dim)}
  .open-range-line::before{left:0}.open-range-line::after{right:0}
  .open-range-fair,.open-range-best{position:absolute;top:-5px;width:2px;height:10px;background:var(--ink2);transform:translateX(-1px)}
  .open-range-best{width:7px;height:7px;top:-4px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px rgba(45,212,167,.55)}
  .open-range-labels{display:flex;justify-content:space-between;font:500 10px/1 var(--mono);color:var(--mut)}

  @media (max-width:720px){
    .open-market{padding-top:14px}.open-meta{padding:0 12px 13px;font-size:10px}
    .open-matchup{justify-content:flex-start;flex-wrap:wrap;padding:5px 12px 18px;font-size:28px}
    .open-read{grid-template-columns:1fr 1fr}.open-quote{padding:14px 12px}
    .open-price{font-size:30px}.open-range{grid-column:1/-1;padding:14px 12px;border-top:1px solid var(--hair)}
    .workspace-nav{position:sticky;top:91px;z-index:8;background:rgba(7,11,15,.96)}
    .workspace-nav a[aria-current="page"]{color:var(--brand);background:var(--brand-dim)}
    [data-pane][hidden]{display:none!important}
    .ws-head{grid-template-columns:1fr;gap:16px;padding-top:12px;align-items:start}
    .ws-fair{text-align:left;padding:14px 0 0;border-left:0;border-top:1px solid var(--hair)}
    .ws-time{grid-column:auto}
    .workspace-nav{overflow-x:auto;scrollbar-width:none}
    .workspace-nav a{min-height:44px;white-space:nowrap}
    .compare-sec.compact tbody tr:nth-child(n+5){display:none!important}
    .compare-more{display:flex;width:100%;min-height:44px;align-items:center;
      justify-content:center;margin-top:10px;color:var(--ink2);background:var(--g1);
      border:1px solid var(--hair2);font:600 11px/1 var(--mono);letter-spacing:.1em}
    /* a section header on a phone is a label, a sentence and sometimes a
       control; in one non-wrapping row the control wins and the sentence is
       crushed. It wraps. */
    .sec-h{flex-wrap:wrap;row-gap:8px}
    /* 44px targets on the two control rows */
    .an-in input{min-height:44px;padding:12px 13px}
    .an-chips .an-chip{display:flex;align-items:center;min-height:44px;
      padding:8px 14px 8px 26px}
    #tlRange{gap:6px}
    #tlRange .an-chip{min-height:44px;display:inline-flex;align-items:center;
      padding:6px 14px}
    /* the range keys sit on their own line rather than being squeezed against
       the section label by margin-left:auto */
    .sec-h #tlRange{margin-left:0;width:100%}
  }
</style>

<body class="game-page">
<a class="skip" href="#main">Skip to content</a>
<main id="main" class="wrap">
  <div class="ws-crumb"><a class="tl" href="/">← MARKET</a></div>
  <!-- OUTSIDE #ws, deliberately. The visible masthead is a two-team diagram,
       so there is no line of text to promote — making either side's name the
       h1 would state the wrong thing about what this page is. This names the
       matchup for a screen reader and a crawler instead.
       It sits outside #ws because every render branch REPLACES ws.innerHTML,
       including the two failure states, so an injected heading would vanish on
       exactly the pages that still need to say what they are. Generic until
       the board identifies the game; the renderer rewrites it in place. -->
  <h1 class="vh" id="gameH">Game</h1>
  <div id="ws"></div>
</main>

<script src="/assets/desk.js"></script>
<script src="/assets/market-tape.js?v=signature-market"></script>
<!-- The matchup workspace is the deepest surface on the site and the one
     page that never loaded this: both team names rendered as bare text on
     every sport, while the board row you arrived from had crests. -->
<script src="/assets/crest.js"></script>
<script>
(function(){
var D=window.Desk;
D.mount("market");
var Q=new URLSearchParams(location.search);
var ID=Q.get("e"), SPQ=Q.get("s")||"";
function sideName(a,txt){
  return String(txt).replace(/side_a/g,a.home).replace(/side_b/g,a.away);
}
var SPORT_LABEL={nfl:"NFL",ncaaf:"CFB",mlb:"MLB",nba:"NBA",nhl:"NHL"};
var ws=document.getElementById("ws");
/* .ld holds the height the workspace is about to need, so the shimmer and the
   instrument it hands off to occupy the same room */
ws.classList.add("ld");
D.connecting(ws,"WORKSPACE");

function findEvent(board){
  var hit=null;
  (board.boards||[]).forEach(function(b){ b.events.forEach(function(e){
    if(String(e.id)===String(ID)) hit={sp:b.sport,e:e};});});
  return hit;
}
function kv(k,v,cls){return '<div class="kv"><span class="k">'+k
  +'</span><span class="v n '+(cls||"")+'">'+v+'</span></div>';}
function cell(k,v,cls){return '<div class="ws-cell"><span class="tl">'+k
  +'</span><div class="v n '+(cls||"")+'">'+v+'</div></div>';}

function render(hit,moves,research,timeline){
  ws.classList.remove("ld");
  var sp=hit.sp, ev=hit.e;
  var isOn=Date.parse(ev.starts)<=Date.now();
  var sides=ev.sides.slice().sort(function(a,b){return (b.fair_prob||0)-(a.fair_prob||0);});
  var fav=sides[0];
  var best=ev.sides.slice().sort(function(a,b){return (b.gain_pts||0)-(a.gain_pts||0);})[0];
  var single=(ev.n_books||0)<2;
  var rep=(research&&(research.reports||[]).filter(function(r){
    return String(r.event_id)===String(ID);})[0])||null;

  /* header + instrument grid */
  var gh=document.getElementById("gameH");
  if(gh) gh.textContent=ev.away+" at "+ev.home;
  /* Marks face inward, so the two sides read as one matchup rather than two
     rows. Sport is passed explicitly: abbreviations collide across leagues
     (ATL, MIA and PHI all exist in more than one), and an unscoped lookup
     deliberately resolves to nothing rather than to a coin flip. */
  function side(name){
    return (window.Crest && Crest.team)
      ? Crest.team(name,{size:24,sport:sp,after:name===ev.away})
      : D.esc(name);
  }
  var quoteProbs=(best.quotes||[]).map(function(q){return D.implied(q.price);});
  var rangeMin=Math.min.apply(null,quoteProbs.concat([best.fair_prob]));
  var rangeMax=Math.max.apply(null,quoteProbs.concat([best.fair_prob]));
  var rangeSpan=Math.max(.0001,rangeMax-rangeMin);
  function rangePos(v){return Math.max(0,Math.min(100,(v-rangeMin)/rangeSpan*100)).toFixed(1);}
  var bestProb=D.implied(best.best_price);
  var html='<section class="open-market rimlit" aria-label="Opening market view">'
    +'<div class="open-meta tl"><span>'+D.esc(SPORT_LABEL[sp]||sp)+' · MONEYLINE</span><span>'
      +(isOn?'CLOSING SNAPSHOT · GAME STARTED':D.esc(D.when(ev.starts)).toUpperCase())
      +' · '+D.esc(String(ev.n_books))+' BOOKS</span></div>'
    +'<div class="open-matchup">'+side(ev.away)+'<span class="at">AT</span>'+side(ev.home)+'</div>'
    +'<div class="open-read">'
      +'<div class="open-quote"><span class="tl">MARKET FAIR PRICE</span><span class="open-side">'
        +D.esc(best.name)+' MONEYLINE</span><div class="open-price">'+D.am(best.fair_price)+'</div></div>'
      +'<div class="open-quote open-best"><span class="tl">BEST AVAILABLE</span><span class="open-side">'
        +D.esc(best.name)+' MONEYLINE</span><div class="open-price">'+(single?'·':D.am(best.best_price))+'</div>'
        +(single?'':'<span class="open-book">'+D.bk(best.best_book)+'</span><span class="open-gap">'
          +D.pts(best.gain_pts)+' PTS VS FAIR</span>')+'</div>'
      +'<div class="open-range"><div class="open-range-head tl"><span>MARKET RANGE</span><span>IMPLIED PROBABILITY</span></div>'
        +'<div class="open-range-line"><i class="open-range-fair" style="left:'+rangePos(best.fair_prob)+'%"></i>'
        +'<i class="open-range-best" style="left:'+rangePos(bestProb)+'%"></i></div>'
        +'<div class="open-range-labels"><span>'+D.pct(rangeMin)+'</span><span>FAIR '+D.pct(best.fair_prob)+'</span><span>'+D.pct(rangeMax)+'</span></div></div>'
    +'</div></section>'
    +'<nav class="workspace-nav" aria-label="Game research sections">'
      +'<a href="#prices" data-pane-target="prices">PRICES</a><a href="#movement" data-pane-target="movement">MOVE</a>'
      +'<a href="#research" data-pane-target="research">RESEARCH</a><a href="#analyst" data-pane-target="analyst">ASK</a></nav>';

  /* one spectrum per side. The pair was the only block on the page arriving
     without a section of its own, so it read as two loose slabs between the
     grid and the ladder; it takes the same rule and header as everything
     else and the page keeps one rhythm all the way down. */
  html+='<div class="sec" id="prices" data-pane="prices"><div class="sec-h"><span class="tl">PRICE BY BOOK</span>'
    +'<span class="sub">every book on one scale, per side, against the de-vigged fair price</span></div>'
    +ev.sides.map(function(s){
    return '<div class="mkt">'
      +'<div class="sec-h"><span class="tl">MONEYLINE · '+D.esc(s.name).toUpperCase()
      +'</span><span class="more tl">FAIR '+D.am(s.fair_price)+'</span></div>'
      +D.spectrum({quotes:s.quotes,fairProb:s.fair_prob,fairPrice:s.fair_price,
        label:"Prices for "+s.name})
      +'</div>';
  }).join("")+'</div>';

  /* sportsbook comparison — both sides, one ladder */
  var books={};
  ev.sides.forEach(function(s,si){ (s.quotes||[]).forEach(function(q){
    (books[q.book]=books[q.book]||{})[si]={price:q.price,
      /* every vigged price sits below fair — that is what vig is. The
         information is WHERE a book ranks in the market, so color follows
         rank (best/worst per side), not the sign, which is always negative. */
      best:q.price===s.best_price, worst:q.price===s.worst_price,
      vs:(s.fair_prob!=null?(s.fair_prob-D.implied(q.price))*100:null)};});});
  var names=Object.keys(books);
  if(names.length>1){
    /* the column headers must name the side the column was BUILT from.
       `books[book][si]` is keyed by the index in ev.sides, while the headers
       were reading from `sides`, which is ev.sides re-sorted by fair
       probability — so on any game where the home side is the favourite the
       two halves of this ladder were labelled with each other's team. Both
       now read from ev.sides. */
    var n0=ev.sides[0].name.split(" ").pop(), n1=ev.sides[1].name.split(" ").pop();
    /* Explicit data-l per cell, and data-stacked so Desk.stack() leaves them
       alone. Stacked into a phone card, two columns called IMPLIED and two
       called VS FAIR are four lines with no way to tell which side each
       belongs to; carrying the team name into the label fixes the card and
       leaves the desktop header short. */
    html+='<div class="sec compare-sec compact" data-pane="prices"><div class="sec-h"><span class="tl">SPORTSBOOK COMPARISON</span>'
      +'<span class="sub">implied probability per book, against the de-vigged fair price</span></div>'
      +'<div class="itab"><div class="scr"><table><thead><tr><th class="l">BOOK</th>'
      +'<th>'+D.esc(n0)+'</th><th>IMPLIED</th><th>VS FAIR</th>'
      +'<th>'+D.esc(n1)+'</th><th>IMPLIED</th><th>VS FAIR</th>'
      +'</tr></thead><tbody>'
      +names.map(function(b){
        function c(x,nm){
          var L=D.esc(String(nm).toUpperCase());
          if(!x) return '<td class="dim" data-l="'+L+'">·</td>'
            +'<td class="dim" data-l="'+L+' IMPLIED">·</td>'
            +'<td class="dim" data-l="'+L+' VS FAIR">·</td>';
          var cls=x.best?"up":x.worst?"dn":"dim";
          return '<td class="'+(x.best?"up":"")+'" data-l="'+L+'">'+D.am(x.price)+'</td>'
            +'<td class="dim" data-l="'+L+' IMPLIED">'+D.pct(D.implied(x.price))+'</td>'
            +'<td class="'+cls+'" data-l="'+L+' VS FAIR">'+D.pts(x.vs)+'</td>';}
        var s0=books[b][0],s1=books[b][1];
        return '<tr data-stacked="1"><td class="l">'+D.bk(b)+'</td>'
          +c(s0,n0)+c(s1,n1)+'</tr>';
      }).join("")
      +'</tbody></table></div></div><button class="compare-more" type="button">SHOW ALL '
      +names.length+' BOOKS</button></div>';
  }

  /* movement — our own capture only */
  var mvRows=[];
  if(moves){ ["divergence","drift"].forEach(function(k){ (moves[k]||[]).forEach(function(a){
    if(String(a.event_id)===String(ID)) mvRows.push(a);});});}
  mvRows.sort(function(a,b){return String(b.observed_at).localeCompare(String(a.observed_at));});
  var tlEv=(timeline&&(timeline.events||[]).filter(function(t){
    return String(t.event_id)===String(ID);})[0])||null;
  html+='<div class="sec" id="movement" data-pane="movement"><div class="sec-h"><span class="tl">MARKET TIMELINE</span>'
    +'<span class="sub">our capture, hourly — a line change starts a new series</span>'
    +(tlEv?'<span class="more" id="tlRange" role="group" aria-label="Timeline window">'
      +[6,24,72].map(function(h){return '<button class="an-chip" data-h="'+h
        +'" aria-pressed="'+(h===72?"true":"false")+'">'+h+'H</button>';}).join(" ")
      +'</span>':'')
    +'</div>';
  if(tlEv){
    html+='<div id="tlHost"></div>';
  }else{
    html+='<div class="feed"><div class="state"><span class="tl">NO PUBLISHED HISTORY YET'
      +'</span>The timeline publishes from the next capture cycle.</div></div>';
  }
  html+='</div>';
  html+='<div class="sec" data-pane="movement"><div class="sec-h"><span class="tl">DETECTED MOVES</span>'
    +'<span class="sub">drift and divergence above threshold, points of implied probability</span></div>';
  if(mvRows.length){
    html+='<div class="feed">'+mvRows.slice(0,6).map(function(a,i){
      var cls=a.kind==="divergence"?"am":(a.move_pts>0?"up":"dn");
      return D.feedRow(i,D.esc(a.market).toUpperCase()
        +'<span class="pts n '+cls+'">'+D.pts(a.move_pts)+' PTS</span>',
        D.esc(sideName(a,a.detail)),
        '<span data-ago="'+D.esc(a.observed_at)+'">'+D.ago(a.observed_at)+'</span>');
    }).join("")+'</div>';
  }else{
    html+='<div class="feed"><div class="state"><span class="tl">NO MOVEMENT ABOVE THRESHOLD</span>'
      +'Nothing above '+((moves&&moves.min_move_pts)||1.5)
      +' pts detected for this game on our capture.</div></div>';
  }
  html+='</div>';

  /* NFL research report facts, when the researcher covers this game */
  if(rep){
    html+='<div class="sec" id="research" data-pane="research"><div class="sec-h"><span class="tl">RESEARCH</span>'
      +'<span class="sub">computed from the matchup report — nothing generated</span>'
      +'<a class="more" href="/research">FULL REPORT →</a></div>'
      +'<div class="feed">'+rep.facts.map(function(f,i){
        return D.feedRow(i,D.esc(f.kind).replace(/_/g," ").toUpperCase(),D.esc(f.text),"");
      }).join("")+'</div></div>';
  }else{
    html+='<div class="sec" id="research" data-pane="research"><div class="sec-h"><span class="tl">RESEARCH</span></div>'
      +'<div class="feed"><div class="state"><span class="tl">NO MATCHUP REPORT</span>'
      +'The market is live, but no published matchup report covers this game.</div></div></div>';
  }

  /* analyst */
  html+='<div class="sec" id="analyst" data-pane="analyst"><div class="sec-h"><span class="tl">ANALYST</span>'
    +'<span class="sub">answers may only use the numbers on this page — it will not pick a side</span></div>'
    /* the chips are questions, not labels — mono caps is the label voice, so
       they were shouting a sentence. Sentence case, same as the board's. */
    +'<div class="an-chips">'
    +['What is the fair price?','Where do the books disagree?','What moved?',
      'Summarize this game']
      .map(function(q){return '<button class="an-chip" data-q="'+D.esc(q)+'">'
        +D.esc(q)+'</button>';}).join("")
    +'</div>'
    +'<label class="vh" for="anq">Ask a question about this game</label>'
    +'<div class="an-in"><input id="anq" placeholder="Ask about this game…" maxlength="500">'
    +'<button id="ango">ASK</button></div>'
    +'<div class="an-out" id="anout"></div></div>';

  ws.innerHTML=html;
  document.title="Sooth — "+ev.away+" at "+ev.home;
  var compare=document.querySelector(".compare-sec"), compareMore=document.querySelector(".compare-more");
  if(compareMore) compareMore.addEventListener("click",function(){
    var compact=compare.classList.toggle("compact");
    this.textContent=compact?"SHOW ALL "+names.length+" BOOKS":"SHOW FEWER BOOKS";
  });

  var paneLinks=[].slice.call(document.querySelectorAll("[data-pane-target]"));
  function setPane(name){
    [].forEach.call(document.querySelectorAll("[data-pane]"),function(p){p.hidden=p.dataset.pane!==name;});
    paneLinks.forEach(function(a){a.setAttribute("aria-current",a.dataset.paneTarget===name?"page":"false");});
  }
  paneLinks.forEach(function(a){a.addEventListener("click",function(e){
    if(innerWidth>720) return;
    e.preventDefault(); setPane(a.dataset.paneTarget);
    document.querySelector(".workspace-nav").scrollIntoView({block:"start"});
  });});
  if(innerWidth<=720) setPane("prices");

  if(tlEv){
    var tlH=72;
    var drawTl=function(){
      var host=document.getElementById("tlHost"), parts=[];
      ["moneyline","spread","total"].forEach(function(mk){
        var m=tlEv.markets[mk]; if(!m) return;
        parts.push('<div class="mkt"><div class="sec-h"><span class="tl">'
          +mk.toUpperCase()+(m.line!=null?" "+(mk==="spread"&&m.line>0?"+":"")+m.line:"")
          +' · '+(m.ref==="over"?"OVER":"HOME")+' SIDE</span></div>'
          +D.timeline(m,{hours:tlH,label:mk+" history",
            marks:mvRows.filter(function(a){return a.market===mk;})}));
      });
      host.innerHTML=parts.join("")||'<div class="feed"><div class="state tl">NO HISTORY</div></div>';
    };
    drawTl();
    document.getElementById("tlRange").addEventListener("click",function(e){
      var b=e.target.closest("[data-h]"); if(!b) return;
      tlH=+b.dataset.h; drawTl();
      [].forEach.call(this.querySelectorAll("[data-h]"),function(x){
        x.setAttribute("aria-pressed",x===b?"true":"false");});
    });
  }

  function ask(q){
    var out=document.getElementById("anout");
    out.innerHTML='<span class="tl">READING THIS GAME…</span>';
    var body=rep?{mode:"matchup",event_id:String(ID),question:q}
      :{question:q+" — the game is "+ev.away+" at "+ev.home+" ("+(SPORT_LABEL[sp]||sp)+")."};
    fetch("/api/ask",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){j._capped=(r.status===429);return j;});})
      .then(function(j){
        /* The cap used to render an upgrade link here. There is no paid tier
           to upgrade to, so a capped answer now just says so \u2014 api/ask.js no
           longer returns an `upgrade` field at all. */
        out.innerHTML=D.answer(j.answer||j.error||"No answer.");
      })
      /* an error state that says what is still true: the analyst note is the
         only thing missing, and every number above it was computed here */
      .catch(function(){out.innerHTML=
        '<span class="tl" style="display:block;margin-bottom:6px">ANALYST UNAVAILABLE</span>'
        +'<p>The note could not be generated right now. Every figure above it is '
        +'computed from the live board and is unaffected.</p>';});
  }
  document.addEventListener("click",function(e){
    var c=e.target.closest(".an-chip[data-q]"); if(c) return ask(c.dataset.q);
    if(e.target.id==="ango"){var v=document.getElementById("anq").value.trim(); if(v) ask(v);}
  });
  document.getElementById("anq").addEventListener("keydown",function(e){
    if(e.key==="Enter"&&e.target.value.trim()) ask(e.target.value.trim());});
}

Promise.all([D.load("/data/board.json"),D.load("/data/moves.json"),
             D.load("/data/research.json"),D.load("/data/timeline.json")]).then(function(rs){
  var bd=rs[0];
  if(!bd.ok){ ws.classList.remove("ld");
    ws.innerHTML='<div class="state"><span class="tl">FEED UNAVAILABLE</span>'
    +'The board could not be loaded, so no price, fair line or movement can be '
    +'shown for this game. The feed rebuilds automatically — try again shortly.</div>'; return; }
  var hit=findEvent(bd.data);
  if(!hit){
    ws.classList.remove("ld");
    ws.innerHTML='<div class="state"><span class="tl">OUT OF PRICING WINDOW</span>'
      +'This game is not on the live board — prices publish as kickoff approaches.'
      +(SPQ==="nfl"?' NFL matchup research may still cover it on <a href="/research" style="color:var(--brand)">the research desk</a>.':'')
      +'</div>';
    var srail=bd.ok?bd.data:null; D.sportRail(srail,SPQ,function(s){D.go("/market");});
    return;
  }
  D.sportRail(bd.data,hit.sp,function(s){D.go("/market");});
  D.land(ws,function(){
    render(hit,rs[1].ok?rs[1].data:null,rs[2].ok?rs[2].data:null,rs[3].ok?rs[3].data:null);
  });
});
})();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>

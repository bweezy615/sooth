name: grade

# Grades the latest sealed slate in public (docs/pick-engine-plan.md, Step 5).
#
# Tuesday morning after Monday Night Football: grade the latest slate against
# settled results and our own captured closes, publish the graded artifact and
# refold the running record, one commit. Losses ship identically to wins —
# the whole point of the pick engine is that this step is automatic and
# unskippable, not a choice we make when the week went well.
#
# CLV stays provenance-gated inside grade.py: a game with no qualifying close
# publishes clv:null with its reason verbatim, never an estimate.

on:
  schedule:
    # Tue 13:00 UTC = 09:00 ET during the season months (Sep-Jan, spill Feb).
    - cron: "0 13 * 9-12 2"
    - cron: "0 13 * 1-2 2"
  workflow_dispatch:
    inputs:
      slate:
        description: "Slate id (defaults to slates.json latest)"
        required: false

permissions:
  contents: write

concurrency:
  group: grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    env:
      PRO_PAYLOAD_KEY: ${{ secrets.PRO_PAYLOAD_KEY }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet requests pandas numpy cryptography markdown

      - name: Grade and publish
        id: g
        run: |
          set -e
          SLATE="${{ inputs.slate }}"
          if [ -z "$SLATE" ]; then
            SLATE="$(python -c "import json;print(json.load(open('site/public/data/slates.json'))['latest'])")"
          fi
          echo "slate=$SLATE" >> "$GITHUB_OUTPUT"
          python -m engine.grade --slate "$SLATE" --publish
          python scripts/publish_record.py

      # Grading writes data/ledger, and site/public/ledger.html is GENERATED
      # from it by scripts/build_site.py. Without this step every grade run
      # publishes a stale trust page and leaves the repo's own gate red
      # (tests/test_build_site.py, and check.sh's "site build is reproducible").
      - name: Rebuild the pages generated from data/ledger
        run: python scripts/build_site.py

      - name: Commit once
        run: |
          git config user.name "sooth-grade"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/data data/ledger
          # The four pages below are named one at a time on purpose. They are
          # everything build_site.py writes, and `site/public/*.html` would
          # also sweep the twenty hand-written pages the generator does not own.
          git add site/public/ledger.html site/public/methodology.html
          git add site/public/verify.html site/public/disclaimers.html
          if git diff --cached --quiet; then
            echo "nothing newly settled - no commit"
            exit 0
          fi
          git commit -m "grade: ${{ steps.g.outputs.slate }} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && sleep 5
          done
          exit 1

      # Mailed from the grading job itself, on purpose. PRODUCT.md commits to
      # publishing a sealed slate whether it wins or loses; a separate "send
      # the results email" workflow would be a place for someone to not press
      # the button on a bad week. Here there is no button.
      - name: Tell the subscribers it is graded
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: python -m engine.alert_lifecycle --kind graded

      - name: Commit the announcement watermark
        run: |
          git add data/lifecycle_sent.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing announced"; exit 0
          fi
          git commit -m "alerts: announced grading $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash && sleep 5
          done
          exit 1

      - name: Every sealed slate past settle time must be graded
        # Runs regardless of what the grade step did, because the failure this
        # catches is the run where grading produced nothing and exited 0. An
        # empty result and an unpublished week were indistinguishable until
        # this step existed. PRODUCT.md commits to publishing a sealed slate
        # whether it wins or loses; this is that promise's only mechanism.
        if: always()
        run: python scripts/check_sealed_graded.py

name: capture-polymarket-whales

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-polymarket-whales
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install --quiet requests

      # Convention from watchlist.yml: prove the selection and the copy guard
      # offline before touching the network. engine/whales.py ships a real
      # selfcheck -- it asserts the advice regex does not match the page copy,
      # that no `email` field escapes into public JSON, and that a mid-capture
      # failure leaves the previous snapshot intact -- and nothing was running
      # it, so none of those guarantees were being enforced.
      - name: Selfcheck (offline)
        run: python -m engine.whales --selfcheck

      - name: Capture public Polymarket sports-futures activity
        run: python -m engine.whales

      - name: Commit snapshot
        run: |
          git config user.name "sooth-capture"
          git config user.email "capture@users.noreply.github.com"
          # whales.json is a whole-file snapshot, not an append-only log, so a
          # rebase against a snapshot another run pushed mid-capture can only
          # ever conflict -- which is exactly how the 03:18 run died after a
          # clean capture. There is no merge to attempt: the newest complete
          # capture is authoritative by construction. So rebuild the commit on
          # top of whatever main is now, and retry if main moves again while we
          # are pushing (ten other workflows commit to this branch).
          for attempt in 1 2 3; do
            cp site/public/data/whales.json "$RUNNER_TEMP/whales.json"
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/whales.json" site/public/data/whales.json
            git add site/public/data/whales.json
            if git diff --staged --quiet; then
              echo "no whale snapshot change"
              exit 0
            fi
            git commit -m "capture: polymarket whales $(date -u +%FT%TZ)"
            if git push; then
              exit 0
            fi
            echo "main moved while pushing; rebuilding (attempt $attempt)"
          done
          echo "::error::could not push the whale snapshot after 3 attempts"
          exit 1

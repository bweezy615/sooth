name: props-live

# Restores the live upcoming-props board.
#
# There are two prop pipelines and only one of them was still running:
#   engine.props_capture -> closing prices, fires near first pitch. On Actions.
#   engine.props         -> the board of props you can actually shop right now.
#                           Only ever run by the local publish.sh.
#
# When publishing moved to Actions, engine.props stopped running anywhere, so
# props.json was left to props_board — which only republishes captured closes.
# Those age out of the window a few hours after first pitch, so from roughly
# 04:00Z until the next night's games the Props tab was empty. Every run on
# 2026-08-11 reported "observations : 0"; the live page showed n_props: 0 while
# telling visitors props "land here automatically, usually by mid-morning".
# That sentence is the contract this workflow exists to keep.
#
# CREDITS. This is the only paid step here and props share one monthly budget
# with the board. On 2026-08-11 the account had 6,567 of 20,000 left while
# capture-odds alone burned ~192/day. So this is gated twice:
#   PROPS_MAX_AGE_H  - skip entirely unless the published board is this stale.
#   PROPS_MAX_CREDITS- hard per-run ceiling the engine will not exceed.
# The cron is the third bound, and it is the one that matters when books have
# nothing posted: an empty board always opens the gate (see below), so a */30
# schedule would pay to re-ask every half hour all night. Every 2h caps this at
# 12 attempts/day — worst case ~144 credits, and closer to ~70 in practice
# because engine.props bails after two empty events. With a populated board the
# 3h age gate skips a third of those outright.
#
# Those three numbers — cron, age, max-credits — are the whole cost model.
#
# Age is read from the CONTENT timestamp, never file mtime: a checkout stamps
# every file to now, so mtime would report "fresh" forever and this would never
# spend a credit. Same trap publish.sh documented on this exact file.

on:
  schedule:
    - cron: "10 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh regardless of age (spends credits)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: props-live
  cancel-in-progress: false

env:
  PROPS_MAX_AGE_H: "3"
  # 18, not 12, because two sports now have games inside the window at once.
  # engine.props caps any single sport at half the run, so 18 buys three
  # events each for college football and baseball rather than four for
  # whichever one the dict reached first. This is a ceiling, not a quota: a
  # night with one sport in season still spends 9. Twelve runs a day puts the
  # worst case at 216 credits against a 20,000/month pool, up from 144.
  PROPS_MAX_CREDITS: "18"

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet requests

      - name: Decide whether the board is stale enough to pay for
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os

          max_age = float(os.environ["PROPS_MAX_AGE_H"])
          forced = os.environ.get("FORCED") == "true"
          n = 0
          try:
              d = json.load(open("site/public/data/props.json"))
              # Count what the PAGE counts. props_board and engine.props write
              # different shapes — only props_board emits a top-level n_props,
              # so reading that key alone scores a healthy 122-prop engine.props
              # board as empty and pays to rebuild it every single cycle.
              # index.html sums boards[].n_props; both shapes carry it. Match it.
              n = sum(int(b.get("n_props") or 0) for b in (d.get("boards") or []))
              ts = max(d.get("generated_at") or "", d.get("checked_at") or "")
              dt = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
              age = (datetime.datetime.now(datetime.timezone.utc) - dt).total_seconds() / 3600
          except Exception:
              age = 1e9

          # An empty board counts as stale no matter how recent its timestamp.
          # This job now owns props.json outright, but the rule stays: it was
          # written because capture-props used to rewrite the file every 30 min
          # even with nothing to publish, so age alone read a permanently empty
          # page as permanently fresh and the gate never opened. Freshness is a
          # fact about the DATA, not about the clock.
          print(f"age_h={age:.1f}")
          print(f"n_props={n}")
          print(f"refresh={'true' if (forced or n == 0 or age >= max_age) else 'false'}")
          PY
        env:
          FORCED: ${{ inputs.force }}

      - name: Snapshot the published board timestamp
        if: steps.gate.outputs.refresh == 'true'
        id: before
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
              print("gen=" + str(json.load(open("site/public/data/props.json")).get("generated_at")))
          except Exception:
              print("gen=none")
          PY

      - name: Refresh the live props board (Odds API)
        id: refresh
        if: steps.gate.outputs.refresh == 'true'
        run: |
          echo "published board age: ${{ steps.gate.outputs.age_h }}h"
          python -m engine.props --window-hours 30 --max-credits "$PROPS_MAX_CREDITS"
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        continue-on-error: true

      # Annotation only makes sense on a genuinely new capture. If the engine
      # kept the previous snapshot, re-annotating it would restate old rosters
      # as current — publish.sh drew this line and it is worth keeping.
      - name: Annotate with hit rates and the strikeout model, then rank on price
        if: steps.gate.outputs.refresh == 'true'
        run: |
          gen_after=$(python -c "import json;print(json.load(open('site/public/data/props.json')).get('generated_at'))" 2>/dev/null || echo none)
          if [ "$gen_after" = "${{ steps.before.outputs.gen }}" ]; then
            echo "board unchanged (kept previous snapshot) - skipping annotation"
            exit 0
          fi
          python -m engine.hitrates || echo "HITRATES failed - props stay unannotated"
          python -m engine.props_model || echo "PROPS MODEL failed - props stay unmodeled"
          # Best prices live inside this step on purpose: the early exit above
          # is the rule that a stale board must not be restated as current, and
          # these are a claim about tonight. They are selected on price
          # (edge_vs_fair_pts), never on model edge - see
          # docs/reports/props-model-negative-result.md for the 48.1% that ruled
          # the model out as a selector. The rendered post is echoed into the
          # job log so it can be read and posted without running anything
          # locally. PRODUCT.md forbids calling these picks; see AGENTS.md.
          echo "--- daily best-prices post ---"
          python -m engine.props_best_prices --top 5 \
            || echo "BEST PRICES failed - props_best_prices.json left as it was"
          # Headshots for whoever is on tonight's board. Resolution is cached
          # against yesterday's map, so a typical run makes a handful of calls
          # for new names only. Never fatal: a board with no faces is the board
          # we shipped before, and engine.player_headshots drops any name it
          # cannot resolve unambiguously rather than guessing a face.
          python -m engine.player_headshots \
            || echo "HEADSHOTS failed - player-headshots.json left as it was"

      - name: Report skip
        if: steps.gate.outputs.refresh != 'true'
        run: echo "board fresh (${{ steps.gate.outputs.n_props }} props, ${{ steps.gate.outputs.age_h }}h < ${PROPS_MAX_AGE_H}h) - no credits spent"

      - name: Commit the refreshed board
        if: steps.gate.outputs.refresh == 'true'
        run: |
          git config user.name  "sooth-capture"
          git config user.email "capture@users.noreply.github.com"
          git add site/public/data/props.json site/public/data/props_best_prices.json \
            site/public/data/player-headshots.json
          if git diff --staged --quiet; then
            echo "no change in props board"
          else
            git commit -m "props: live board refresh $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      # The refresh above is the whole job, and it carries continue-on-error so
      # that a half-written board still reaches the commit step. The cost of
      # that, unguarded, is that engine.props can fail on every single run --
      # a bad key, a missing dep, an API change -- and this workflow reports
      # success every time while the board freezes. Same defect capture-evidence
      # shipped with on 2026-08-28. Skipped runs are not failures, so this only
      # fires when we decided to spend credits and got nothing for them.
      - name: Fail if the board refresh did not run
        if: always() && steps.refresh.outcome == 'failure'
        run: |
          echo "engine.props failed - the live props board was not refreshed."
          echo "Credits may have been spent; /props is serving the old board."
          exit 1

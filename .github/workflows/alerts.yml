name: send-alerts

# Email a subscriber the moment a book is paying over the market on a game that
# hasn't started. Detection lives in engine.alerts; this workflow is the
# delivery arm (engine.alert_email).
#
# Alerts are FREE and opt-in, not a Pro feature. This job used to draw its
# recipients from active Stripe subscriptions, which — with Pro disarmed — is
# an empty set by construction, so the most-requested feature in the whole
# competitive scan was wired to nobody. Recipients now come from
# engine.subscribers: people who confirmed an address at /alerts.
#
# It recomputes from the committed capture history rather than the published
# moves.json — capture-odds refreshes data/capture every 30 min, moves.json is
# only rebuilt by the local publish. Dedup is data/alerts_sent.json, committed
# here so a re-run or two overlapping ticks never double-send.
#
# Runs a few minutes after capture-odds so the freshest prices are already in.
# Needs three repo secrets beyond ODDS_API_KEY: STRIPE_SECRET_KEY (where the
# subscriber list lives), RESEND_API_KEY (the sender), and AUTH_SECRET (signs
# the unsubscribe link). No subscribers yet => it records-and-skips.

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: send-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet requests

      # --min-send is only the floor for a run with nobody subscribed; a real
      # run scans at the lowest threshold anyone on the list actually chose and
      # then filters each alert per person. AUTH_SECRET signs the unsubscribe
      # link in every email — without it the sender refuses to send at all.
      - name: Email fresh divergence alerts to subscribers
        run: python -m engine.alert_email --min-send 2.0
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      # /alerts tells a visitor how much mail to expect, and that sentence has
      # to stay a measurement. It is a replay of the committed capture history
      # through the same detector this job just ran, so it belongs here rather
      # than on a schedule of its own: regenerated wherever the sender runs,
      # and it cannot go stale by anyone forgetting to rerun a script.
      - name: Re-measure how often alerts actually fire
        run: python scripts/alert_frequency.py
        env:
          PYTHONPATH: .

      - name: Commit the sent-watermark and the measured frequency
        run: |
          git config user.name  "sooth-capture"
          git config user.email "capture@users.noreply.github.com"
          git add data/alerts_sent.json site/public/data/alert-frequency.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "alerts: sent-watermark $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi

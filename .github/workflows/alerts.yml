name: send-alerts

# The Sooth Pro flagship: email a subscriber the moment a book is paying over
# the market on a game that hasn't started. Detection lives in engine.alerts;
# this workflow is the delivery arm (engine.alert_email).
#
# It recomputes from the committed capture history rather than the published
# moves.json — capture-odds refreshes data/capture every 30 min, moves.json is
# only rebuilt by the local publish. Dedup is data/alerts_sent.json, committed
# here so a re-run or two overlapping ticks never double-send.
#
# Runs a few minutes after capture-odds so the freshest prices are already in.
# Needs two repo secrets beyond ODDS_API_KEY: STRIPE_SECRET_KEY (who is Pro) and
# RESEND_API_KEY (the sender). No subscribers yet => it records-and-skips.

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: send-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet requests

      - name: Email fresh divergence alerts to Pro subscribers
        run: python -m engine.alert_email --min-send 2.0
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Commit the sent-watermark
        run: |
          git config user.name  "sooth-capture"
          git config user.email "capture@users.noreply.github.com"
          git add data/alerts_sent.json
          if git diff --staged --quiet; then
            echo "no new alerts emailed"
          else
            git commit -m "alerts: sent-watermark $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi

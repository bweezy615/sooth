name: deploy-site

# Publishes site/public to GitHub Pages. The site is pre-built static files,
# so there is no build step - which is also why it can be hosted anywhere and
# why the published data stays independently verifiable.

on:
  # The capture cron commits a fresh board.json to main every few hours, but a
  # push made with the default GITHUB_TOKEN deliberately does NOT trigger other
  # workflows (GitHub's recursion guard). So `push` fires only on human/exec
  # pushes, and the live board froze ~8h behind main between them. `workflow_run`
  # is not subject to that guard: it fires whenever capture-odds completes, which
  # is what actually refreshes the board. See docs/reports/2026-08-04-exec.md.
  workflow_run:
    workflows: ["capture-odds"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'site/public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Don't publish off a failed capture run; push/dispatch have no such field.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deployment
        uses: actions/deploy-pages@v4

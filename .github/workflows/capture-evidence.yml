name: capture-evidence

# The free half of odds capture, on its own schedule.
#
# WHY THIS IS SEPARATE FROM capture.yml
# -------------------------------------
# capture.yml does two unrelated jobs that happen to have been written
# together: engine.capture reads ESPN and spends nothing, and engine.lines
# buys the multi-sport board from the Odds API at ~5 credits a run. Sharing one
# workflow meant sharing one schedule, so the free, irreplaceable half was
# rationed by the paid half's budget for no reason.
#
# It mattered because the two problems were hiding each other. On 2026-08-28
# the Odds API plan was 500 credits/month with 113 left, and the */30 cron in
# capture.yml was delivering about three runs a day rather than 48. Three runs
# a day at 5 credits is 450 a month - almost exactly the plan. Fix either alone
# and the other breaks loudly. See docs/plans/capture-cadence.md.
#
# ESPN deletes a game's odds block when the game ends and there is no backfill
# anywhere, so a run that does not happen before kickoff is evidence that
# cannot be bought back afterwards. This workflow exists so that never depends
# on a credit balance.
#
# :13 and :43 rather than */30 on purpose. GitHub documents `schedule` as
# best-effort and drops it hardest on the round minutes that every other
# repo's cron also lands on. The odd offset is the cheapest available
# mitigation for the dropped-run problem measured in the memo.
#
# The concurrency group is deliberately the same string as capture.yml's.
# Both workflows commit and push to main, and a shared group is what stops
# them racing each other's rebase.

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-odds
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # engine.capture imports adapters.nfl for its schedule lookup, which
      # pulls pandas. The first version of this workflow installed requests
      # alone on the theory that the free path was dependency-light; both
      # capture steps died on ModuleNotFoundError and the run still reported
      # success, because continue-on-error was masking them. Hence the guard
      # at the end of this job.
      - name: Install deps
        run: pip install --quiet requests pandas numpy

      # Each sport is continue-on-error so one league's endpoint having a bad
      # morning cannot cost us the other league's evidence. capture exits
      # non-zero on a short page AFTER writing its rows, so a partial slate is
      # still committed and still reported as partial.
      - name: Capture NFL game lines (free, ESPN)
        id: nfl
        run: python -m engine.capture --season 2026 --weeks 3
        continue-on-error: true

      - name: Capture college football game lines (free, ESPN)
        id: ncaaf
        run: python -m engine.capture --sport ncaaf --season 2026 --weeks 2
        continue-on-error: true

      # continue-on-error above is per sport on purpose: one league's endpoint
      # having a bad morning must not cost us the other league's evidence. But
      # it also means a run in which NOTHING was captured reports success, and
      # a green tick over an empty archive is worse than a red one - it is the
      # failure you do not go looking for. If both sports failed, so did this
      # job.
      - name: Fail if neither sport was captured
        if: steps.nfl.outcome == 'failure' && steps.ncaaf.outcome == 'failure'
        run: |
          echo "both capture steps failed - no evidence was collected this run"
          exit 1

      - name: Commit captured odds
        if: always()
        run: |
          git config user.name  "sooth-capture"
          git config user.email "capture@users.noreply.github.com"
          git add data/capture
          if git diff --staged --quiet; then
            echo "no new observations"
          else
            git commit -m "capture: evidence snapshot $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi

name: capture-props

# MLB pitcher-strikeout prop closes.
#
# Unlike capture-odds (free ESPN game lines), each per-event prop call costs a
# real Odds API credit. Listing events is free, so idle ticks cost nothing.
#
# Cadence == window (30 min, see engine/props_capture.WINDOW): each staggered
# first pitch is caught by ~one tick, so we spend ~1 credit/game (~15/day,
# ~450/mo) and stay inside the free tier. --max-credits is a hard floor so a
# bug can never drain the account.
#
# The commit is the point as much as the data: GitHub's timestamp attests we
# held a given prop price before first pitch — the beat-close evidence base.

on:
  schedule:
    # Trimmed 30min->2h on 2026-08-22: the props endpoints are the quota's
    # heaviest eater and the 20K month was running dry before Week 1. Restore
    # */30 after the Sept billing reset if the burn rate allows.
    - cron: "20 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-props
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet requests

      - name: Capture pitcher-K prop closes
        run: python -m engine.props_capture --max-credits 20
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # This job no longer publishes props.json. It captures, and that is all.
      #
      # props.json had two writers with incompatible shapes: props_board here
      # (MLB-only, rebuilt from captured closes, top-level n_props) every 30
      # min, and engine.props in props-live.yml (multi-sport, live, annotated
      # with hit rates and the strikeout model, no top-level n_props) every 2h.
      # Each overwrote the other wholesale. Run 31528564882 caught it live: the
      # 122-prop board from props-live was one non-empty MLB tick away from
      # being replaced by a thinner closes-derived one, and both jobs report
      # green either way, so the board would have flip-flopped in silence.
      #
      # props-live owns the file now. Closes still reach the page, because the
      # last live board captured before first pitch IS the closing snapshot,
      # and index.html already labels a board whose games have all started.
      # engine.props_board stays in the tree for manual rebuilds and backfills.
      - name: Commit captured props
        run: |
          git config user.name  "sooth-capture"
          git config user.email "capture@users.noreply.github.com"
          mkdir -p data/capture/mlb-props   # empty-slate ticks write nothing; keep add from erroring
          git add data/capture/mlb-props
          if git diff --staged --quiet; then
            echo "no new prop observations"
          else
            git commit -m "capture: mlb props snapshot $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
